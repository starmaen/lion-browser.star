<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lion Browser - New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }
    
    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }
    
    .search-box input {
      flex: 1;
      padding: 15px 20px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .search-box button {
      padding: 15px 30px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
    }
    
    .search-box button:hover {
      background: #f0f0f0;
    }
    
    .quick-links {
      display: flex;
      gap: 20px;
    }
    
    .quick-link {
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      transition: background 0.3s;
    }
    
    .quick-link:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <img src="icon.png" alt="Lion Icon" class="logo">
  <h1>Lion Browser</h1>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث في Google...">
    <button id="searchBtn">بحث</button>
  </div>
  
  <div class="quick-links">
    <a href="https://google.com" class="quick-link">Google</a>
    <a href="https://youtube.com" class="quick-link">YouTube</a>
    <a href="https://github.com" class="quick-link">GitHub</a>
  </div>
  
  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    
    function performSearch() {
      const query = searchInput.value.trim();
      if (query) {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }
    }
    
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });
  </script>
</body>
</html>
